# MP114 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G146"          # your group id, e.g. "G042"
problem_id: "MP114"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: plan_gb_limit         # the column recorded in a different unit
    group_value: Semi-urban     # the value of circle whose rows are affected
    factor: 1024          # wrong value = right value x factor
  sentinel_value:
    present: true
    column: video_minutes
    value: 9999           # the special number typed instead of a blank
    count: 50            # how many rows have it
  duplicate_rows:
    present: true
    count: 46           # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: phone_tier
    true_levels: 3     # how many real categories there are after cleaning

tracking:
  experiment_name: mp114-mobile-data
  best_run_id: 280ab8e6ce154d6e94d1ebc651bba6f9
  registered_model_name: mp114-data-model
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    age: null
    screen_hours: null
    apps_installed: null
    plan_gb_limit: null
    video_minutes: null
    wifi_hours: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of circle
    'Urban': null
    'Semi-urban': null
    'Rural': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
